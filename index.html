<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trắc nghiệm 2026</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .question {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .answer {
            display: block;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .answer:hover {
            background: #f5f5f5;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0958d9;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TRẮC NGHIỆM 2026</h1>

    <div class="question">

        <h3>Câu 1. Đây là câu hỏi thử nghiệm?</h3>

        <label class="answer">
            <input type="radio" name="q1" value="A">
            A. Đáp án A
        </label>

        <label class="answer">
            <input type="radio" name="q1" value="B">
            B. Đáp án B
        </label>

        <label class="answer">
            <input type="radio" name="q1" value="C">
            C. Đáp án C
        </label>

        <label class="answer">
            <input type="radio" name="q1" value="D">
            D. Đáp án D
        </label>

    </div>

    <button onclick="chamDiem()">
        NỘP BÀI
    </button>

    <div id="result"></div>

</div>

<script>

function chamDiem() {

    let diem = 0;

    let cau1 = document.querySelector(
        'input[name="q1"]:checked'
    );

    if (cau1 && cau1.value === "B") {
        diem++;
    }

    document.getElementById("result").innerHTML =
        "Kết quả: " + diem + "/1";

}

</script>

</body>
</html>
